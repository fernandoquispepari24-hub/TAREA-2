<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio de Ruido Ambiental</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 20px;
            background-color: #e8f4f8;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #1e88e5; /* Azul medio */
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input[type="number"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #4caf50; /* Verde */
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 17px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #43a047;
        }
        #registros-previos {
            margin-top: 15px;
            padding: 10px;
            border: 1px dashed #1e88e5;
            border-radius: 5px;
            background-color: #f0f8ff;
            min-height: 40px;
        }
        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            background-color: #bbdefb; /* Azul claro */
            color: #1a237e; /* Azul muy oscuro */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Promedio de Ruido Ambiental (dB)</h2>
        
        <label for="numMediciones">Número de mediciones a registrar:</label>
        <input type="number" id="numMediciones" min="1" step="1" placeholder="Ej: 5">
        
        <button onclick="calcularPromedioRuido()">Iniciar Registro y Calcular Promedio</button>
        
        <p style="margin-top: 20px;">Mediciones registradas:</p>
        <div id="registros-previos">Presiona el botón para empezar.</div>
        
        <div id="resultado"></div>
    </div>

    <script>
        function calcularPromedioRuido() {
            const numMedicionesInput = document.getElementById('numMediciones').value;
            const N = parseInt(numMedicionesInput);
            const resultadoDiv = document.getElementById('resultado');
            const registrosDiv = document.getElementById('registros-previos');
            
            // 1. Validar el número de mediciones
            if (isNaN(N) || N <= 0) {
                resultadoDiv.innerHTML = "❌ **Error:** Por favor, ingresa un número de mediciones entero y positivo.";
                return;
            }

            let sumaDecibeles = 0;
            let registros = [];
            
            registrosDiv.innerHTML = "Iniciando registro...";
            
            // 2. Bucle FOR para registrar las N mediciones
            for (let i = 1; i <= N; i++) {
                // Usamos prompt() para solicitar los datos de forma secuencial, simulando el flujo FOR
                let dbInput = prompt(`Medición ${i} de ${N}: Ingresa el nivel de ruido en decibeles (dB):`);
                let db = parseFloat(dbInput);

                // Validación simple de la medición
                if (isNaN(db) || db < 0) {
                     alert(`Valor inválido en la medición ${i}. El proceso se detendrá y debes intentarlo de nuevo.`);
                     registrosDiv.innerHTML = "Proceso cancelado por entrada inválida.";
                     resultadoDiv.innerHTML = "";
                     return; // Salir de la función
                }

                // Sumar el valor y guardarlo para mostrar
                sumaDecibeles += db;
                registros.push(db.toFixed(1));
            }

            // 3. Calcular promedio
            const promedio = sumaDecibeles / N;

            // 4. Mostrar el resultado
            registrosDiv.innerHTML = `Valores (${N} total): ${registros.join(' dB | ')} dB`;
            resultadoDiv.innerHTML = `
                ✅ **Cálculo Finalizado**<br>
                Suma total: ${sumaDecibeles.toFixed(2)} dB<br>
                Promedio de ruido ambiental: **${promedio.toFixed(2)} dB**
            `;
        }
    </script>

</body>
</html>
