<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Focos de Calor</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 20px;
            background-color: #fcebeb; /* Fondo claro y cálido */
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 30px;
            background-color: #ffffff;
            border: 2px solid #e74c3c; /* Borde rojo */
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.2);
        }
        h2 {
            color: #c0392b; /* Rojo ladrillo */
            text-align: center;
            margin-bottom: 20px;
        }
        p.instruction {
            background-color: #f7f3f3;
            padding: 10px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 20px;
            font-style: italic;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #e74c3c;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #e74c3c; /* Rojo vivo */
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
        }
        button:hover {
            background-color: #c0392b;
        }
        #lista-temperaturas {
            min-height: 40px;
            padding: 10px;
            border: 1px dashed #e74c3c;
            border-radius: 5px;
            margin-bottom: 20px;
            background-color: #fffafa;
        }
        #resultado {
            margin-top: 15px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.3em;
            text-align: center;
            font-weight: bold;
            background-color: #f1c40f; /* Amarillo/Naranja */
            color: #333;
        }
        .hot-spot {
            color: #c0392b; /* Rojo para foco de calor */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌡️ Detección de Focos de Calor</h2>
        
        <p class="instruction">
            Ingresa la temperatura medida (°C). El proceso de registro terminará automáticamente cuando ingreses **0**.
        </p>
        
        <div class="input-group">
            <input type="number" id="temperatura" step="any" placeholder="Temperatura en °C">
            <button id="btn-registrar" onclick="registrarTemperatura()">Registrar</button>
        </div>

        <p>Temperaturas registradas:</p>
        <div id="lista-temperaturas">Esperando la primera lectura...</div>
        
        <div id="resultado">Presiona registrar para comenzar.</div>
    </div>

    <script>
        // Variables globales
        let contadorFocos = 0; // Contará las temperaturas >= 45°C
        let temperaturasRegistradas = []; // Array para historial de lecturas
        const UMBRAL = 45; // Definir el umbral en una constante
        let registroActivo = true;

        function registrarTemperatura() {
            if (!registroActivo) {
                alert("El registro ya ha finalizado (se ingresó 0°C). Recarga para empezar de nuevo.");
                return;
            }
            
            const inputElement = document.getElementById('temperatura');
            const tempInput = inputElement.value;
            const temperatura = parseFloat(tempInput);
            const resultadoDiv = document.getElementById('resultado');

            // 1. Validación y Condición de Parada (WHILE)
            if (isNaN(tempInput) || tempInput.trim() === "") {
                resultadoDiv.innerHTML = "❌ **Error:** Por favor, ingresa un valor numérico válido.";
                resultadoDiv.style.backgroundColor = '#f8d7da';
                resultadoDiv.style.color = '#721c24';
                return;
            }
            
            // Simulación de la condición de parada del bucle WHILE
            // El bucle continuaría "mientras la temperatura no sea 0"
            if (temperatura === 0) {
                registroActivo = false;
                mostrarResultado();
                // Deshabilitar controles al finalizar
                inputElement.disabled = true; 
                document.getElementById('btn-registrar').disabled = true;
                return;
            }
            
            // 2. Ejecución del cuerpo del bucle (mientras temp !== 0)
            
            // a) Contar si supera el umbral
            if (temperatura >= UMBRAL) {
                contadorFocos++; 
            }
            
            // b) Almacenar el registro
            temperaturasRegistradas.push(temperatura);
            
            // c) Actualizar la interfaz
            actualizarListaTemperaturas(temperatura);
            inputElement.value = ''; // Limpiar el input
            inputElement.focus();
            resultadoDiv.innerHTML = `Llevas ${temperaturasRegistradas.length} lecturas. ${contadorFocos} focos de calor detectados.`;
            resultadoDiv.style.backgroundColor = '#f1c40f';
            resultadoDiv.style.color = '#333';
        }
        
        function actualizarListaTemperaturas(nuevaTemp) {
            const listaDiv = document.getElementById('lista-temperaturas');
            
            const item = document.createElement('span');
            item.textContent = `${nuevaTemp.toFixed(1)}°C`;
            
            // Resaltar si es un foco de calor
            if (nuevaTemp >= UMBRAL) {
                item.className = 'hot-spot';
                item.textContent += ' (ALERTA)';
            }
            
            listaDiv.appendChild(item);
            listaDiv.appendChild(document.createTextNode(' | '));
        }

        function mostrarResultado() {
            const resultadoDiv = document.getElementById('resultado');
            
            resultadoDiv.innerHTML = `
                ✅ **REGISTRO FINALIZADO** (Se ingresó 0°C)<br>
                Total de lecturas: **${temperaturasRegistradas.length}**<br>
                Focos de calor detectados ($\ge 45^\circ\text{C}$): **${contadorFocos}**
            `;
            resultadoDiv.style.backgroundColor = '#2ecc71'; /* Verde de éxito */
            resultadoDiv.style.color = '#ffffff';
        }
        
        // Inicializar la lista al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('lista-temperaturas').innerHTML = 'Esperando la primera lectura...';
        });
    </script>

</body>
</html>
